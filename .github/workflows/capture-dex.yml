name: Capture Dex ownership regression

on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  leafgreen-and-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: devkitpro/devkitarm:20260610@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    env:
      GAME_VERSION: LEAFGREEN
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
      COMPARE: 0
      AGBCC_REV: da598c1d918402c42c0c0d7128ba14567f3175e9
    steps:
      - name: Check out build inputs only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Makefile
            /config.mk
            /*.mk
            /charmap.txt
            /ld_script*.ld
            /sym_*.txt
            /.gitattributes
            /.gitignore
            /.github/workflows/
            /asm/
            /constants/
            /data/
            /graphics/
            /include/
            /sound/
            /src/
            /tools/
            !/**/*.gba
            !/**/*.sav
            !/**/*.srm
            !/**/*.elf
            !/**/*.o
            !/**/*.exe
            !/**/*.dll
            !/**/*.so
            !/**/*.sym
            !/**/__pycache__/
            /data/mb_berry_fix.gba
            /data/mb_colosseum.gba
            /data/mb_ereader.gba

      - name: Check pinned embedded clients and reject game or save inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          embedded_clients = {
            "data/mb_berry_fix.gba": [
              15348,
              "f3d87e14688faf0190b33e071607887c7783462b45f92f1cb7135eec56260740"
            ],
            "data/mb_colosseum.gba": [
              163840,
              "1c0d4d793ad87df3cb8d2b3d636db63b6255955b27c9927d69728fcc1fdbbe22"
            ],
            "data/mb_ereader.gba": [
              14176,
              "eee7d18515904336a71335452d9b57c0234eb7208984a152a88345229c97b0a0"
            ]
          }
          blocked = {'.gba', '.sav', '.srm'}
          found = set()
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in blocked:
                  continue
              name = p.as_posix()
              assert name in embedded_clients, 'Unexpected game/save input in checkout'
              size, digest = embedded_clients[name]
              raw = p.read_bytes()
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, name
              found.add(name)
          assert found == set(embedded_clients), 'Missing pinned embedded client input'
          assert not Path('work').exists()
          assert not any(Path('.').glob('.qa-*'))
          PY

      - name: Install build and 32-bit host compiler dependencies
        shell: bash
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends build-essential gcc-multilib libpng-dev git python3 python3-pil

      - name: Compile and run actual 32-bit C ownership and negative-control tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa/capture_dex_regression.py --cc gcc --report /tmp/capture-dex-regression.json

      - name: Check preserved opening and title raw payloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          media = {
            "graphics/intro/opening_movie_v7/pixels.8bpp": [
              14192640,
              "ff8c4e7f91ef541952f638043efdfe396d416777aaa984350869da3e603b66c3"
            ],
            "graphics/intro/opening_movie_v7/palettes.gbapal": [
              178688,
              "f253176e6ead3f2f5dd55c01de2f33881ce143527c464d076d2786bc348724f7"
            ],
            "graphics/title_screen/thunder_yellow/approved-title-v8.8bpp": [
              38400,
              "266b8c5764de352fd471c742705cc8744eeff15c16e13c557854b514d6153eff"
            ],
            "graphics/title_screen/thunder_yellow/approved-title-v8-start-roi.8bpp": [
              645120,
              "65f31390c8c1065dc28a3ea36a2990a8c351cd121d4be5c3e2f2d17c266d1e33"
            ],
            "graphics/title_screen/thunder_yellow/approved-title-v8.gbapal": [
              512,
              "e4888a4dcd5539808992724f60e9891393a950904ee06c817a601977285ebdd2"
            ]
          }
          for name, (size, digest) in media.items():
              raw = Path(name).read_bytes()
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, name
          print('Five existing opening/title payloads match the preserved baseline hashes')
          PY

      - name: Build the documented agbcc revision
        shell: bash
        run: |
          set -euo pipefail
          agbcc_dir="$(mktemp -d)"
          git -C "$agbcc_dir" init -q
          git -C "$agbcc_dir" remote add origin https://github.com/pret/agbcc.git
          git -C "$agbcc_dir" fetch -q --depth=1 origin "$AGBCC_REV"
          git -C "$agbcc_dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$agbcc_dir" rev-parse HEAD)" = "$AGBCC_REV"
          (cd "$agbcc_dir" && ./build.sh && ./install.sh "$GITHUB_WORKSPACE")

      - name: Build host tools and generated inputs without nested jobserver shells
        shell: bash
        run: |
          set -euo pipefail
          make tools COMPARE=0 2>&1 | tee /tmp/capture-dex-prereqs.log
          make generated GAME_VERSION=LEAFGREEN COMPARE=0 SETUP_PREREQS=0 NODEP=1 2>&1 | tee -a /tmp/capture-dex-prereqs.log

      - name: Build LeafGreen and check the explicit legacy ELF diagnostic control
        shell: bash
        run: |
          set -euo pipefail
          test -x "${DEVKITARM:?}/bin/arm-none-eabi-ld"
          make leafgreen -j"$(nproc)" COMPARE=0 SETUP_PREREQS=0 LD="${DEVKITARM:?}/bin/arm-none-eabi-ld --warn-rwx-segments" 2>&1 | tee /tmp/capture-dex-control.log
          make GAME_VERSION=LEAFGREEN COMPARE=0 SETUP_PREREQS=0 syms 2>&1 | tee -a /tmp/capture-dex-control.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          warning = re.compile(r'\bwarning\s*:', re.I)
          prerequisite_warnings = [line for line in Path('/tmp/capture-dex-prereqs.log').read_text(errors='replace').splitlines() if warning.search(line)]
          assert not prerequisite_warnings, '\n'.join(prerequisite_warnings)
          warnings = [line for line in Path('/tmp/capture-dex-control.log').read_text(errors='replace').splitlines() if warning.search(line)]
          known = re.compile(r'.*/arm-none-eabi-ld: warning: \.\./\.\./pokemonthyl\.elf has a LOAD segment with RWX permissions')
          assert len(warnings) == 1 and known.fullmatch(warnings[0]), '\n'.join(warnings)
          paths = ['pokemonthyl.gba', 'pokemonthyl.elf', 'pokemonthyl.sym', 'pokemonthyl.map']
          report = {'known_control_warning': warnings[0], 'sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}}
          Path('/tmp/capture-dex-link-control.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Relink with the target diagnostic policy and require identical outputs
        shell: bash
        run: |
          set -euo pipefail
          touch ld_script.ld
          test -x "${DEVKITARM:?}/bin/arm-none-eabi-ld"
          make leafgreen -j"$(nproc)" COMPARE=0 SETUP_PREREQS=0 LD="${DEVKITARM:?}/bin/arm-none-eabi-ld --no-warn-rwx-segments" 2>&1 | tee /tmp/capture-dex-build.log
          make GAME_VERSION=LEAFGREEN COMPARE=0 SETUP_PREREQS=0 syms 2>&1 | tee -a /tmp/capture-dex-build.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          warnings = [line for line in Path('/tmp/capture-dex-build.log').read_text(errors='replace').splitlines()
                      if re.search(r'\bwarning\s*:', line, re.I)]
          assert not warnings, '\n'.join(warnings)
          control = json.loads(Path('/tmp/capture-dex-link-control.json').read_text())
          for name, digest in control['sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          print('ROM, ELF, symbols and map are byte-identical with and without the one legacy ELF diagnostic')
          PY

      - name: Validate compiled picture and palette data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('capture_dex_regression', 'tools/qa/capture_dex_regression.py')
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          report = regression.validate_data(Path.cwd(), built=True)
          Path('/tmp/capture-dex-built-assets.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY

      - name: Record source provenance and limits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          report = json.loads(Path('/tmp/capture-dex-regression.json').read_text())
          provenance = {
              'source_commit': subprocess.check_output(['git', '-c', 'safe.directory=' + str(Path.cwd()), 'rev-parse', 'HEAD'], text=True).strip(),
              'base_source': 'dafcb39f781d8fc29e0877f64f6cd9358e5b0c41 (114688-byte heap baseline)',
              'build': 'LEAFGREEN revision 0, COMPARE=0',
              'rom_sha256': hashlib.sha256(Path('pokemonthyl.gba').read_bytes()).hexdigest(),
              'symbols_sha256': hashlib.sha256(Path('pokemonthyl.sym').read_bytes()).hexdigest(),
              'link_diagnostic_control': json.loads(Path('/tmp/capture-dex-link-control.json').read_text()),
              'regression': report,
              'built_assets': json.loads(Path('/tmp/capture-dex-built-assets.json').read_text()),
              'limits': ['Host ownership test with GPU/audio/scheduling/decompression doubles',
                         'Not an emulator or installed iOS Delta runtime test',
                         'Not a rebuild of the delivered R23 DexFix ROM',
                         'No ROM, save, symbol or test artifact upload'],
          }
          print(json.dumps(provenance, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('LeafGreen COMPARE=0 build/symbols, explicit ELF diagnostic byte-equivalence, and 32-bit C ownership regression passed.\n\n')
              summary.write('This tests the older Codespaces-source backport. It does not rebuild the delivered R23 ROM or verify the installed iOS Delta app. No game/save artifacts are uploaded.\n')
          PY
