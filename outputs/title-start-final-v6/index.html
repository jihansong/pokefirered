<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunder Yellow START review v6</title><style>body{margin:0;background:#0b1020;color:#f9e98a;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(96vw,960px);text-align:center}img,video{width:100%;image-rendering:pixelated;background:#000}button{font:700 22px system-ui;color:#211b07;background:#ffdf54;border:0;border-radius:9px;padding:12px 40px;margin:18px;cursor:pointer}p{color:#bec7d5}</style><main><img id="idle" src="title-start-final-v6-static.png" alt="Thunder Yellow title"><video id="run" src="title-start-final-v6.mp4" playsinline preload="auto" hidden></video><button id="start">START</button><p id="status">START를 누르면 원본 피카! 음성과 FR/LG 타이틀 음악·연속 크래클, 입모양·번개가 함께 재생됩니다.</p><p><a href="title-start-final-v6.gif">무음 GIF 보기</a> · <a href="title-start-contact-sheet.png">프레임 검수표</a></p><small>검토용 미리보기 · 게임 ROM 미적용</small></main><script>const b=document.getElementById('start'),v=document.getElementById('run'),i=document.getElementById('idle'),s=document.getElementById('status');b.onclick=async()=>{b.disabled=true;i.hidden=true;v.hidden=false;v.currentTime=0;try{await v.play();s.textContent='재생 중: 피카! / 천둥 시각 효과 / FR/LG 음악 + 연속 크래클'}catch(e){v.hidden=true;i.hidden=false;b.disabled=false;s.textContent='재생하지 못했습니다: '+e.message}};v.onended=()=>{v.hidden=true;i.hidden=false;b.disabled=false;s.textContent='START를 눌러 다시 확인할 수 있습니다.'};</script></html>
